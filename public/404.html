<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Optic — Redirecting</title>
    <script>
      // Single Page App redirect for static web hosts without native rewrite support
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="background:#09090b;color:#a1a1aa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to requested page...</p>
  </body>
</html>
